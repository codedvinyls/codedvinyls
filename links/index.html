:root{
  --paper:#f7f4ec; --surface:#fffdf8; --ink:#1f1e1b; --muted:#817b70;

}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.page{max-width:var(--max);margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* 허브 = 워드마크만(사이트 메뉴 칸은 숨김 — 버튼 4개가 첫 화면에 들어오게) */
.top-grid{display:grid;grid-template-columns:1fr;border-bottom:1px solid var(--line);background:var(--surface)}
.logo-cell{max-width:560px;width:100%;margin:0 auto;padding:30px clamp(20px,5vw,32px) 24px;display:flex;flex-direction:column;gap:12px}
.logo-cell img{width:176px;height:auto}
.logo-sub{font-family:var(--mono);font-size:11px;color:#5d5950}
.nav-cell{display:none}

main{flex:1}
.lk-wrap{max-width:560px;margin:0 auto;padding:clamp(22px,5vw,40px) clamp(20px,5vw,32px) clamp(40px,8vw,64px)}
.lk-where{margin:0 0 18px;font-size:13.5px;color:#5d5950}
.lk-list{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.lk-btn{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 2px;border-bottom:1px solid var(--line);transition:background .18s}
.lk-btn:hover{background:var(--surface)}
.lk-text{display:flex;flex-direction:column;gap:6px;min-width:0}
.lk-label{font-size:clamp(20px,5.4vw,24px);font-weight:800;letter-spacing:-.01em;line-height:1.2}
.lk-sub{font-size:14px;line-height:1.45;color:#5d5950;font-variant-numeric:tabular-nums}
.lk-arrow{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);font-family:var(--mono);font-size:15px}
.lk-btn:hover .lk-arrow{background:var(--yellow);border-color:var(--yellow)}

footer{background:var(--ink);color:var(--paper)}
.footer-base{max-width:560px;margin:0 auto;padding:20px clamp(20px,5vw,32px);font-family:var(--mono);font-size:12px}
.footer-base a{border-bottom:1px solid var(--yellow)}
</style>
